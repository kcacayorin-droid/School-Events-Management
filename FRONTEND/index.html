<!-- SCHOOL ACTIVITIES -->
<section class="content-section" id="activitiesListSection">

    <div class="section-heading">
        <div>
            <h2>School Activities</h2>
            <p>Add, view, search, and manage school activities.</p>
        </div>
    </div>

    <!-- ADD ACTIVITY FORM -->
    <form id="activityForm" class="event-form">
        <div class="form-grid">

            <div class="form-group">
                <label for="activityTitle">Activity Title</label>
                <input type="text" id="activityTitle"
                    placeholder="Enter activity title" required>
            </div>

            <div class="form-group">
                <label for="activityDate">Activity Date</label>
                <input type="date" id="activityDate" required>
            </div>

            <div class="form-group full-width">
                <label for="activityDescription">Description</label>
                <textarea id="activityDescription"
                    placeholder="Enter activity description"></textarea>
            </div>

            <div class="form-group">
                <label for="activityLocation">Location</label>
                <input type="text" id="activityLocation"
                    placeholder="Enter location" required>
            </div>

            <div class="form-group">
                <label for="activityOrganizer">Organizer</label>
                <input type="text" id="activityOrganizer"
                    placeholder="Enter organizer name">
            </div>

        </div>

        <button type="submit" class="submit-btn">
            + Add Activity
        </button>
    </form>

    <!-- SEARCH ACTIVITIES -->
    <input type="text" id="searchActivity"
        class="search-input"
        placeholder="Search activities by title or location...">

    <!-- ACTIVITY LIST -->
    <div id="activityList" class="event-list">
        <p>Loading activities...</p>
    </div>

</section>
