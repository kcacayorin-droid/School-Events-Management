
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Events Management</title>
    <link rel="stylesheet" href="./style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #091f42, #e8eef7);
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }

        .login-container {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(25, 45, 80, 0.15);
            text-align: center;
        }

        .school-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin: 0 auto 15px;
            display: block;
        }

        .school-name {
            color: #294d82;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }

        .login-container h1 {
            color: #243b60;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #78869b;
            margin-bottom: 28px;
            font-size: 14px;
            line-height: 1.5;
        }

        #loginForm {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #loginForm input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dce3ef;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            background: #f9fbff;
        }

        #loginForm input:focus {
            border-color: #315b9a;
            box-shadow: 0 0 0 3px rgba(49, 91, 154, 0.10);
        }

        #loginForm button {
            width: 100%;
            padding: 14px;
            background: #294d82;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #loginForm button:hover {
            background: #1d3965;
        }

        .register-text {
            margin-top: 24px;
            color: #78869b;
            font-size: 14px;
        }

        .register-text a,
        .back-home {
            color: #315b9a;
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover,
        .back-home:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 22px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img
            src="./SBCI.PNG.webp"
            alt="Subic Bay Colleges Logo"
            class="school-logo"
        >

        <p class="school-name">
            SUBIC BAY COLLEGES (SBCI), INC.
        </p>

        <h1>Welcome Back!</h1>

        <p class="login-subtitle">
            Login to your School Events Management account
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login to Account</button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <a href="index.html" class="back-home">← Back to Home</a>

    </div>

    <script src="./script.js"></script>

</body>
</html>
